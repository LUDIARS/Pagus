<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pagus — AI村</title>
    <style>
      :root { color-scheme: dark; --dock-h: 0px; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: #0b0e14; color: #cdd6e4;
        font-family: system-ui, sans-serif;
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
      }
      #topbar {
        display: flex; flex-direction: column; gap: 8px;
        padding: 8px 16px; background: #11151f; border-bottom: 1px solid #222; flex: 0 0 auto;
      }
      .topbar-info, .topbar-actions { display: flex; align-items: center; gap: 12px; width: 100%; }
      .topbar-actions { flex-wrap: wrap; }
      #hud { font-size: 14px; }
      #status { font-size: 12px; color: #7f8aa3; margin-left: auto; }
      #settings-wrap { position: relative; }
      #settings-menu {
        display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 100;
        width: 360px; max-width: calc(100vw - 24px); padding: 10px; background: #11151f; border: 1px solid #38405a; border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      }
      #settings-menu.show { display: block; }
      #settings-menu > button { width: 100%; }
      .settings-section-title { font-size: 13px; font-weight: bold; color: #f2c94c; margin-bottom: 4px; }
      .settings-menu-action { margin-top: 10px; border-color: #56ccf2; color: #cdeeff; }
      button { background: #1e2533; color: #cdd6e4; border: 1px solid #38405a; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
      button:hover { background: #283044; }

      /* PC: 左=介入 / 中央=ステージ。 */
      #main { display: flex; gap: 12px; padding: 12px; flex: 1 1 auto; min-height: 0; }
      .col {
        display: flex; flex-direction: column; gap: 10px;
        background: #0e121b; border: 1px solid #222; border-radius: 8px;
        padding: 12px; overflow-y: auto;
      }
      #left { width: 400px; flex: 0 0 400px; padding: 0; overflow: hidden; }
      #right { width: 360px; flex: 0 0 360px; overflow: hidden; }
      .side-tabs {
        display: flex; flex-wrap: wrap; gap: 2px; flex: 0 0 auto;
        margin: -4px -4px 0; padding: 0 4px; border-bottom: 1px solid #222;
      }
      .side-tab-btn {
        background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
        min-height: 36px; padding: 7px 10px; font-size: 12px; color: #8b96ad;
      }
      .side-tab-btn:hover { background: rgba(86,204,242,0.08); color: #e6ebf5; }
      .side-tab-btn.active { border-bottom-color: #56ccf2; color: #9be3ff; font-weight: 700; }
      .side-tab-panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
      .side-tab-panel[hidden] { display: none; }

      /* 中央: ステージは全面、ログは中央ちょい下に重ねる。 */
      #center { flex: 1 1 auto; min-width: 0; position: relative; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
      #stage { position: absolute; inset: 0; line-height: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #log {
        position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
        width: 72%; max-height: 38%; overflow: hidden;
        display: flex; flex-direction: column; gap: 3px;
        background: rgba(8, 10, 16, 0.62); border: 1px solid #2a3346; border-radius: 10px;
        padding: 10px 14px; backdrop-filter: blur(2px); pointer-events: none;
      }
      .ov-line { font-size: 16px; line-height: 1.45; color: #e6ebf5; text-shadow: 0 1px 2px #000; }

      /* パネル共通 */
      h3 { margin: 0 0 4px; font-size: 15px; }
      .sub { margin-top: 8px; font-size: 12px; color: #8b96ad; border-top: 1px solid #1b2231; padding-top: 6px; }
      .muted { font-size: 12px; color: #8b96ad; }
      .desc { font-size: 13px; line-height: 1.5; }
      .verdict { font-size: 14px; font-weight: bold; color: #eb5757; margin-top: 4px; }
      .ident { display: flex; align-items: center; gap: 10px; }
      .ident-face { width: 52px; height: 52px; object-fit: contain; background: #0b0e14; border-radius: 8px; }
      .ident-name { font-size: 17px; font-weight: bold; }
      .stat-row { display: flex; align-items: center; gap: 8px; }
      .stat-label { width: 64px; font-size: 12px; color: #b9c2d6; }
      .bar { flex: 1; height: 9px; background: #1b2231; border-radius: 5px; overflow: hidden; }
      .bar > i { display: block; height: 100%; border-radius: 5px; }
      .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
      .kv-val { font-weight: bold; }

      /* 右の裁判ボタン */
      #trial { background: #1a1410; border: 1px solid #5a3a2a; border-radius: 8px; padding: 10px; display: none; }
      #trial .trial-title { font-size: 13px; margin-bottom: 8px; color: #f2c94c; }
      #trial button { display: inline-block; margin: 3px 4px 3px 0; }
      #trial .vote-kill { border-color: #eb5757; }
      #trial .vote-spare { border-color: #56ccf2; }
      #trial .trial-verdict { margin-top: 8px; font-size: 13px; color: #eb5757; }
      #radar { background: #0e121b; border: 1px solid #222; border-radius: 8px; align-self: center; }

      .log-sho { color: #f2c94c; }
      .log-ten { color: #f2994a; }
      .log-ketsu { color: #eb5757; }

      .hist-date { margin: 10px 0 4px; font-weight: bold; color: #56ccf2; border-bottom: 1px solid #1b2231; padding-bottom: 2px; }
      .hist-line { font-size: 13px; line-height: 1.6; padding: 1px 0 1px 8px; }

      /* 状態パネル (§7)。アクションオーバーレイ「情報」タブ内のウィジェット。 */
      .ao-status { background: rgba(14,18,27,0.6); border: 1px solid #2a3346; border-radius: 8px; font-size: 12px; }
      #status-head { padding: 6px 10px; cursor: pointer; user-select: none; color: #9be3ff; font-weight: bold; }
      #status-head:hover { background: #1a2230; }
      #status-body { padding: 0 10px 8px; max-height: 50vh; overflow-y: auto; }
      #status-body .sub { margin-top: 6px; color: #8b96ad; border-top: 1px solid #1b2231; padding-top: 4px; }
      #status-body .muted { color: #6b7689; font-size: 11px; }
      #status-body .kv { font-size: 12px; }

      /* プレイヤー行動ドック (§4): 画面下に独立した横並びバー。PC・モバイル共通。 */
      #interventions { background: #181016; border: 1px solid #5a3a52; border-radius: 8px; padding: 10px; }
      #interventions .dock-row { min-height: 0; }
      #interventions .dock-commands { flex-direction: column; }
      #interventions .dock-cmd-btn { width: 100%; flex: none; min-width: 0; }
      .dock-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; min-height: 60px; }
      .dock-action-row { justify-content: center; }
      .dock-commands { display: flex; gap: 8px; width: 100%; }
      .dock-cmd-btn { display: flex; flex-direction: column; align-items: center; gap: 1px;
        flex: 1; min-width: 120px; white-space: nowrap; padding: 8px 10px; font-size: 13px; line-height: 1.15; }
      .dock-cmd-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .dock-cmd-label { font-weight: bold; }
      .dock-cmd-cost { font-size: 10px; color: #8b96ad; }
      .dock-cmd-btn.cmd-incite { border-color: #eb5757; color: #ff8a8a; }
      .dock-cmd-btn.cmd-sanction { border-color: #f2994a; color: #f2b988; }
      .dock-cmd-btn.cmd-cheer { border-color: #6fcf97; color: #9be0b5; }
      .dock-cmd-btn.cmd-champion { border-color: #f2c94c; color: #f2e0a0; }
      .dock-verdict { display: flex; gap: 10px; margin-top: 8px; }
      .dock-verdict-btn { flex: 1; padding: 10px 12px; font-size: 16px; font-weight: bold; }
      .dock-verdict-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .dock-verdict-kill { border-color: #eb5757; color: #ffb3b3; }
      .dock-verdict-spare { border-color: #56ccf2; color: #cdeeff; }
      .dock-dialog-backdrop { display: none; position: fixed; inset: 0; z-index: 90;
        background: rgba(0,0,0,0.58); align-items: center; justify-content: center; padding: 16px; }
      .dock-dialog-backdrop.show { display: flex; }
      .dock-dialog { width: 560px; max-width: calc(100vw - 28px); max-height: calc(100vh - 32px);
        display: flex; flex-direction: column; background: #11151f; border: 1px solid #38405a;
        border-radius: 10px; overflow: hidden; box-shadow: 0 18px 48px rgba(0,0,0,0.55); }
      .dock-dialog-head { display: flex; align-items: center; justify-content: space-between;
        padding: 10px 14px; border-bottom: 1px solid #222; }
      .dock-dialog-title { font-size: 15px; font-weight: bold; color: #f2c94c; }
      .dock-dialog-close { padding: 2px 10px; font-size: 18px; }
      .dock-dialog-body { overflow-y: auto; padding: 12px 14px 14px; }
      .dock-dialog-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
      .dock-dialog-label { font-size: 12px; color: #8b96ad; }
      .dock-dialog-select { width: 100%; background: #0e121b; color: #cdd6e4;
        border: 1px solid #38405a; border-radius: 6px; padding: 8px; font-size: 13px; }
      .dock-target-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .dock-target-btn { min-height: 42px; text-align: left; }

      /* カードパネル (§v1.3-A)。 */
      #cards { background: #131019; border: 1px solid #4a3a5a; border-radius: 8px; padding: 10px; }
      #cards h3 { color: #c79bf2; }

      /* アイテムパネル (§16)。 */
      #items { background: #16130e; border: 1px solid #5a4a2a; border-radius: 8px; padding: 10px; }
      #items h3 { color: #f2d08a; }
      .item-kinds { display: flex; gap: 6px; margin: 4px 0 8px; }
      .item-kind-btn { flex: 1; padding: 7px 4px; font-size: 13px; border-color: #c0a04f; color: #f2e6c0; }
      .item-kind-btn.active { background: #283044; box-shadow: 0 0 0 1px #f2c94c inset; }
      .item-counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
      .item-count { flex: 1 1 92px; padding: 5px 7px; background: #11100c; border: 1px solid #3a321f; border-radius: 6px; font-size: 12px; color: #f2e6c0; }
      .item-btn { width: 100%; margin: 4px 0 2px; }
      .item-btn.item-field { border-color: #6fcf97; color: #d0f2e0; }
      .item-btn.item-champion { border-color: #f2c94c; color: #f2e0a0; }

      /* 政治パネル (§v1.3-C)。 */
      #governance { background: #15131a; border: 1px solid #4a4566; border-radius: 8px; padding: 10px; }
      #governance h3 { color: #b9aef2; }
      .gov-btn { flex: 1; padding: 7px 4px; font-size: 12px; border-color: #6f63c0; color: #d8d0f2; }
      .gov-incite { border-color: #eb5757; }
      .gov-suppress { border-color: #56ccf2; }
      .gov-yes { border-color: #6fcf97; }
      .gov-no { border-color: #eb5757; }
      .gov-recall { width: 100%; margin: 4px 0 2px; border-color: #eb5757; color: #ffb3b3; }
      .gov-poll { margin: 4px 0 8px; padding: 6px 8px; background: #11101a; border: 1px solid #2c2840; border-radius: 6px; }
      .gov-poll .kv { font-size: 12px; }
      .gov-laws { margin: 4px 0; display: flex; flex-direction: column; gap: 6px; }
      .gov-law { padding: 6px 8px; background: #11101a; border: 1px solid #2c2840; border-radius: 6px; }
      .gov-law-text { font-size: 13px; }
      .gov-law-meta { font-size: 11px; color: #8b96ad; margin: 2px 0 4px; }

      /* 演出・協力パネル (§v1.3-D)。 */
      #spectacle { background: #181016; border: 1px solid #5a3a52; border-radius: 8px; padding: 10px; }
      #spectacle h3 { color: #f29bd0; }
      .spc-btn { width: 100%; margin: 4px 0 2px; border-color: #c06fa0; color: #f2d0e6; }
      .spc-raid-btn { border-color: #eb5757; color: #ffb3b3; }
      .spc-pray { border-color: #9be3ff; color: #cdeeff; }
      .spc-raid { margin: 4px 0 6px; padding: 6px 8px; background: #1a0e14; border: 1px solid #4a2a38; border-radius: 6px; }
      .spc-hp-bar { height: 12px; background: #1b2231; border-radius: 6px; overflow: hidden; border: 1px solid #4a2a38; margin: 4px 0; }
      .spc-hp-bar > i { display: block; height: 100%; background: #eb5757; }
      .spc-highlights { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
      .spc-hl { padding: 6px 8px; background: #120e14; border: 1px solid #2c2436; border-radius: 6px; }
      .spc-hl-month { margin-top: 4px; font-size: 12px; color: #f2c94c; font-weight: bold; }
      .spc-hl-head { font-size: 12px; color: #f29bd0; }
      .spc-hl-body { font-size: 12px; color: #b9c2d6; line-height: 1.4; }

      /* 住民パネル。 */
      #residents { background: #10171a; border: 1px solid #31545a; border-radius: 8px; padding: 10px; }
      #residents h3 { color: #9be3ff; }
      .resident-gacha { display: flex; gap: 6px; margin: 4px 0 8px; }
      .resident-gacha-status { min-height: 16px; font-size: 11px; }
      .resident-btn { flex: 1; padding: 7px 4px; font-size: 12px; border-color: #56ccf2; color: #cdeeff; }
      .resident-karma { border-color: #f2c94c; color: #f2e0a0; }
      .resident-list { display: flex; flex-direction: column; gap: 5px; }
      .relationship-graph { background: #0d1417; border: 1px solid #24353a; border-radius: 6px; overflow: hidden; }
      .relationship-svg { display: block; width: 100%; height: 240px; }
      .rel-edge-pos { stroke: #6fcf97; }
      .rel-edge-neg { stroke: #eb5757; }
      .rel-node-dot { fill: #11151f; stroke: #56ccf2; stroke-width: 1.5; }
      .rel-node-label { fill: #e6ebf5; font-size: 9px; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
      .rel-legend { display: flex; gap: 10px; padding: 5px 7px; border-top: 1px solid #24353a; font-size: 11px; color: #8b96ad; }
      .rel-legend-pos { color: #9be0b5; }
      .rel-legend-neg { color: #ffb3b3; }
      .resident-row { padding: 6px 8px; background: #0d1417; border: 1px solid #24353a; border-radius: 6px; }
      .resident-title { font-size: 13px; font-weight: bold; }
      .resident-meta { font-size: 11px; color: #8b96ad; line-height: 1.35; }

      /* 経済パネル (§v1.3-B)。 */
      #economy { background: #101813; border: 1px solid #3a5a45; border-radius: 8px; padding: 10px; }
      #economy h3 { color: #8fe0b0; }
      .eco-btn { width: 100%; margin: 4px 0 2px; border-color: #4f9f6f; color: #d0f2e0; }
      .eco-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .eco-auction { margin: 4px 0 6px; padding: 6px 8px; background: #0e1410; border: 1px solid #2a3a30; border-radius: 6px; }
      .card-btn { width: 100%; margin: 4px 0 2px; border-color: #8a6fcf; color: #e0d0f2; }
      .card-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .ctl-state { margin-bottom: 6px; }
      .target-select { width: 100%; margin: 4px 0 8px; background: #0e121b; color: #cdd6e4;
        border: 1px solid #38405a; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
      .ctl-btns { display: flex; gap: 6px; }
      .ctl-btns button { flex: 1; padding: 8px 4px; font-size: 13px; }
      #btn-incite { border-color: #eb5757; }
      #btn-sanction { border-color: #f2994a; }
      #btn-cheer { border-color: #6fcf97; }
      .btn-champion { width: 100%; margin-top: 4px; border-color: #f2c94c; color: #f2e0a0; }

      /* 裁判ベット UI (§3)。 */
      #bet { background: #161018; border: 1px solid #5a3a4a; border-radius: 8px; padding: 10px; display: none; }
      #bet h3 { color: #e98ad0; margin: 0 0 6px; }
      .bet-pool, .bet-your { margin-bottom: 4px; }
      .bet-amount-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .bet-amount { flex: 1; background: #0e121b; color: #cdd6e4; border: 1px solid #38405a; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
      .bet-btns { display: flex; gap: 6px; }
      .bet-btns button { flex: 1; padding: 8px 4px; font-size: 13px; }
      .bet-death { border-color: #eb5757; }
      .bet-educate { border-color: #56ccf2; }

      /* スコアボード UI (§4)。 */
      #leaderboard { background: #0e121b; border: 1px solid #2a3346; border-radius: 8px; padding: 10px; }
      #leaderboard h3 { color: #f2c94c; margin: 0 0 6px; }
      .faction-tug { margin-bottom: 8px; }
      .tug-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #1b2231; border: 1px solid #2a3346; }
      .tug-bar > i { display: block; height: 100%; }
      .tug-guide { background: #6fcf97; }
      .tug-incite { background: #eb5757; }
      .tug-legend { font-size: 12px; color: #b9c2d6; margin-top: 3px; text-align: center; }
      .faction-btns { display: flex; gap: 6px; margin-bottom: 8px; }
      .faction-btns button { flex: 1; padding: 7px 4px; font-size: 12px; }
      .faction-guide { border-color: #6fcf97; }
      .faction-incite { border-color: #eb5757; }
      .lb-list { display: flex; flex-direction: column; gap: 4px; }
      .lb-row { padding: 5px 8px; border: 1px solid #1b2231; border-radius: 6px; background: #11151f; }
      .lb-row.lb-me { border-color: #f2c94c; background: #1a1810; }
      .lb-top { display: flex; justify-content: space-between; align-items: baseline; }
      .lb-name { font-size: 13px; font-weight: bold; }
      .lb-tags { font-size: 11px; color: #9be3ff; }
      .lb-meta { font-size: 11px; color: #8b96ad; margin-top: 2px; }

      /* しきたり改定 UI (§2)。 */
      .rule-add-box { display: flex; gap: 6px; margin-bottom: 10px; }
      .rule-add-input { flex: 1; background: #0e121b; color: #cdd6e4; border: 1px solid #38405a;
        border-radius: 6px; padding: 6px 8px; font-size: 13px; }
      .rule-add-btn { white-space: nowrap; border-color: #6fcf97; font-size: 12px; }
      .hist-rule-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .rule-remove-btn { white-space: nowrap; border-color: #eb5757; color: #ffb3b3; font-size: 11px; padding: 3px 8px; }

      /* アカウントパネル (§v1.3-F): 課金モック。 */
      #account { background: #14110e; border: 1px solid #5a4a2a; border-radius: 8px; padding: 10px; }
      #account h3 { color: #f2d08a; margin: 0 0 6px; }
      .topup-btns { display: flex; gap: 6px; margin: 4px 0 2px; }
      .topup-btn { flex: 1; padding: 8px 4px; font-size: 13px; border-color: #c0a04f; color: #f2e6c0; }
      #account-overlay {
        display: none; position: fixed; inset: 0; z-index: 78;
        background: rgba(0,0,0,0.62); align-items: center; justify-content: center; padding: 18px;
      }
      #account-overlay.show { display: flex; }
      #account-box {
        width: min(430px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
        background: #0e121b; border: 1px solid #38405a; border-radius: 10px;
        box-shadow: 0 18px 54px rgba(0,0,0,0.58); overflow: hidden;
      }
      #account-head {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 11px 14px; background: #11151f; border-bottom: 1px solid #222;
        font-weight: 700; color: #f2c94c;
      }
      #account-close { padding: 3px 10px; font-size: 18px; }
      #account-body { overflow-y: auto; padding: 14px; }
      #account-body #account { background: transparent; border: 0; border-radius: 0; padding: 0; }
      .acct-code-row { display: flex; gap: 6px; margin: 4px 0 2px; }
      .acct-code, .acct-login { flex: 1; min-width: 0; background: #0e121b; color: #cdd6e4;
        border: 1px solid #38405a; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
      .acct-code { font-family: ui-monospace, monospace; }
      .acct-copy, .acct-login-btn { white-space: nowrap; border-color: #c0a04f; color: #f2e6c0; font-size: 12px; }
      .acct-login-btn { border-color: #9be3ff; color: #cdeeff; }

      /* 別端末ログインで追い出された時の恒久オーバーレイ (§v1.3-F)。 */
      #logged-out { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.78);
        display: flex; align-items: center; justify-content: center; }
      .logged-out-box { background: #11151f; border: 1px solid #5a3a2a; border-radius: 12px;
        padding: 24px 32px; text-align: center; max-width: 90vw; }
      .logged-out-title { font-size: 18px; font-weight: bold; color: #f2c94c; margin-bottom: 8px; }
      .logged-out-msg { font-size: 14px; color: #cdd6e4; }

      /* コマンド却下トースト。 */
      #toast { position: fixed; bottom: calc(var(--dock-h) + 16px); left: 50%; transform: translateX(-50%) translateY(20px);
        z-index: 80; background: rgba(40,16,16,0.95); color: #ffb3b3; border: 1px solid #eb5757;
        border-radius: 8px; padding: 10px 18px; font-size: 14px; opacity: 0; pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease; }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      #chronicle {
        display: none; position: fixed; inset: 0; z-index: 75;
        background: rgba(0,0,0,0.62); align-items: center; justify-content: center; padding: 18px;
      }
      #chronicle.show { display: flex; }
      #chronicle-box {
        width: min(860px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
        background: #0e121b; border: 1px solid #38405a; border-radius: 10px;
        box-shadow: 0 18px 54px rgba(0,0,0,0.58); overflow: hidden;
      }
      #chronicle-head {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 11px 14px; background: #11151f; border-bottom: 1px solid #222;
        font-weight: 700; color: #f2c94c;
      }
      #chronicle-close { padding: 3px 10px; font-size: 18px; }
      #chronicle-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

      /* 村の歴史タブ。 */
      .hist-tabs { display: flex; flex-wrap: wrap; gap: 2px; flex: 0 0 auto;
        background: #11151f; padding: 8px 12px 0; border-bottom: 1px solid #222; }
      .hist-tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
        min-height: 36px; font-size: 12px; padding: 7px 11px; color: #8b96ad; }
      .hist-tab:hover { background: rgba(86,204,242,0.08); color: #e6ebf5; }
      .hist-tab.active { background: transparent; border-bottom-color: #56ccf2; color: #9be3ff; font-weight: 700; }
      .hist-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 18px 18px; }
      .hist-villager { padding: 5px 8px; border-bottom: 1px solid #1b2231; }
      .hist-villager.gone { opacity: 0.5; }
      .hist-villager-name { font-size: 13px; font-weight: bold; }
      .hist-villager-meta { font-size: 11px; color: #8b96ad; }
      #village-rules, #intervention-rules { background: #11151f; border: 1px solid #2a3346; border-radius: 8px; overflow: hidden; min-height: 320px; display: flex; flex-direction: column; }
      #village-rules { min-height: 260px; }
      #intervention-rules { margin-top: 10px; min-height: 0; }

      /* 裁判の有罪/無罪ボタン (中央上寄り、裁判中のみ表示)。 */
      #verdict { display: none; position: absolute; top: 12%; left: 0; right: 0; justify-content: center; gap: 40px; pointer-events: none; }
      #verdict.show { display: flex; }
      .verdict-btn {
        pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 14px 30px; border-radius: 14px; cursor: pointer;
        border: 3px solid; background: rgba(10,12,18,0.72); backdrop-filter: blur(2px);
        transition: transform 0.08s ease, box-shadow 0.15s ease;
      }
      .verdict-btn:hover { transform: scale(1.05); }
      .verdict-btn:active { transform: scale(0.97); }
      .vb-ja { font-size: 30px; font-weight: 900; line-height: 1; }
      .vb-en { font-size: 13px; letter-spacing: 1px; opacity: 0.85; }
      .verdict-btn.guilty { border-color: #eb5757; color: #ff8a8a; box-shadow: 0 0 22px rgba(235,87,87,0.35); }
      .verdict-btn.guilty:hover { box-shadow: 0 0 30px rgba(235,87,87,0.6); }
      .verdict-btn.innocent { border-color: #56ccf2; color: #9be3ff; box-shadow: 0 0 22px rgba(86,204,242,0.35); }
      .verdict-btn.innocent:hover { box-shadow: 0 0 30px rgba(86,204,242,0.6); }

      /* 左ペインの統合介入パネル (§v1.3-E): 全ユーザ操作を 1 つのタブ式パネルへ集約。 */
      #action-overlay {
        position: fixed; top: 88px; right: 12px; bottom: calc(var(--dock-h) + 8px); z-index: 55;
        width: 384px; max-width: calc(100vw - 24px);
        display: flex; flex-direction: column;
        background: #0e121b; border: 1px solid #2a3346; border-radius: 10px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        transition: transform 0.25s ease;
      }
      #action-overlay.closed { transform: translateX(calc(100% + 16px)); pointer-events: none; }
      /* 常時ヘッダ: カルマ残高 / 善性 / 課金 / 推し / クールダウン。 */
      #ao-header { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #222; }
      .ao-chip { display: flex; gap: 5px; align-items: baseline;
        background: #141a26; border: 1px solid #2a3346; border-radius: 6px; padding: 4px 9px; font-size: 12px; }
      .ao-chip-label { color: #8b96ad; }
      .ao-chip-val { font-weight: bold; color: #e6ebf5; }
      #ao-tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid #222; background: #11151f; }
      .ao-tab-btn { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
        min-height: 38px; padding: 8px 11px; font-size: 12px; color: #8b96ad; }
      .ao-tab-btn:hover { background: rgba(86,204,242,0.08); color: #e6ebf5; }
      .ao-tab-btn.active { background: transparent; border-bottom-color: #56ccf2; color: #9be3ff; font-weight: 700; }
      #ao-content { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
      .ao-tab { display: flex; flex-direction: column; gap: 10px; }
      #ao-backdrop { display: none; }
      #left #action-overlay { position: static; inset: auto; z-index: auto; width: 100%; max-width: none;
        flex: 1 1 auto; min-height: 0; height: 100%; border: 0; border-radius: 8px; box-shadow: none; transform: none; }
      #left #action-overlay.closed { transform: none; pointer-events: auto; }

      /* ユーザーチャット。 */
      #chat { background: #10151d; border: 1px solid #2a405a; border-radius: 8px; padding: 10px; }
      #chat h3 { color: #9be3ff; }
      .chat-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; margin-bottom: 8px; }
      .chat-row { padding: 6px 8px; background: #0d121a; border: 1px solid #1d2a3c; border-radius: 6px; }
      .chat-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #8b96ad; margin-bottom: 2px; }
      .chat-name { color: #9be3ff; font-weight: bold; }
      .chat-text { font-size: 13px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
      .chat-form { display: flex; gap: 6px; }
      .chat-input { flex: 1; min-width: 0; background: #0e121b; color: #cdd6e4; border: 1px solid #38405a; border-radius: 6px; padding: 7px 8px; font-size: 13px; }
      .chat-send { white-space: nowrap; border-color: #56ccf2; color: #cdeeff; }

      /* モバイル: 中央を全画面、左右はスライドインのドロワー。 */
      .drawer-toggle { display: none; }
      #backdrop { display: none; }
      /* タブレット〜モバイル: 中央を全画面、左右はスライドインのドロワー。
         行動ドックは画面下に残し、ドロワー/オーバーレイ/バックドロップはドックの上で止める。 */
      @media (max-width: 860px) {
        :root { --dock-h: 0px; }
        #hud { font-size: 12px; }
        .drawer-toggle { display: inline-block; }
        #main { padding: 8px; gap: 0; }
        #center { flex: 1 1 auto; }
        #left, #right {
          display: flex; flex-direction: column; gap: 10px;
          background: #0e121b; border: 1px solid #222; padding: 12px; overflow-y: auto;
          position: fixed; top: 88px; bottom: 0; z-index: 30;
          width: 92%; max-width: 420px;
          transition: transform 0.25s ease; box-shadow: 0 0 24px rgba(0,0,0,0.6);
        }
        #left {
          top: auto; left: 0; right: 0; bottom: 0;
          width: 100%; max-width: none; height: min(78dvh, 680px); max-height: calc(100dvh - 88px);
          overflow: hidden; padding: 8px;
          transform: translateY(105%); border-radius: 14px 14px 0 0;
        }
        #right { right: 0; transform: translateX(105%); border-radius: 10px 0 0 10px; }
        #left.open, #right.open { transform: translateX(0); }
        #left.open { transform: translateY(0); }
        #backdrop.show { display: block; position: fixed; inset: 88px 0 0 0; background: rgba(0,0,0,0.5); z-index: 20; }
        #log { width: 86%; bottom: 10%; }
        .ov-line { font-size: 15px; }
        #verdict { gap: 16px; top: 8%; }
        .verdict-btn { padding: 10px 18px; }
        .vb-ja { font-size: 22px; }
        .vb-en { font-size: 11px; }
        /* メニューオーバーレイはモバイルで右からのドロワー (ドックの上で止める)。 */
        #action-overlay { top: 88px; right: 0; bottom: var(--dock-h); width: 92%; max-width: 420px;
          border-radius: 10px 0 0 10px; z-index: 60; }
        #ao-backdrop.show { display: block; position: fixed; inset: 88px 0 var(--dock-h) 0; background: rgba(0,0,0,0.5); z-index: 56; }
        .dock-row { flex-wrap: wrap; min-height: 0; }
        .dock-commands { flex-wrap: wrap; }
      }

      /* スマホ縦: タイトルを省き、行動ボタンを等分配置して指で押しやすく。 */
      @media (max-width: 520px) {
        :root { --dock-h: 0px; }
        .dock-commands { width: 100%; }
        .dock-cmd-btn { flex: 1 1 calc(50% - 8px); min-width: 0; padding: 7px 2px; }
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <div class="topbar-info">
        <span id="hud">接続待ち…</span>
        <span id="status"></span>
      </div>
      <div class="topbar-actions">
        <button id="btn-left" class="drawer-toggle">🎛 介入</button>
        <button id="hist-btn">📜 歴史</button>
        <button id="account-btn">💴 課金</button>
        <div id="settings-wrap">
          <button id="settings-btn">⚙ 設定</button>
          <div id="settings-menu">
            <div id="account-settings"></div>
            <button id="push-btn" class="settings-menu-action">🔔 通知</button>
          </div>
        </div>
        <button id="btn-right" class="drawer-toggle">📊 情報</button>
      </div>
    </div>
    <div id="chronicle">
      <div id="chronicle-box">
        <div id="chronicle-head"><span>📜 村の歴史</span><button id="chronicle-close">×</button></div>
        <div id="chronicle-body"></div>
      </div>
    </div>
    <div id="account-overlay">
      <div id="account-box">
        <div id="account-head"><span>💴 課金</span><button id="account-close">×</button></div>
        <div id="account-body"><div id="account"></div></div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="main">
      <div id="left" class="col">
        <div id="action-overlay">
          <div id="ao-header"></div>
          <div id="ao-tabs"></div>
          <div id="ao-content">
            <section class="ao-tab" data-tab="intervention" data-label="🎛 介入">
              <div id="resident-gacha"></div>
              <div id="interventions"></div>
            </section>
            <section class="ao-tab" data-tab="card" data-label="🃏 カード">
              <div id="cards"></div>
            </section>
            <section class="ao-tab" data-tab="item" data-label="🎁 アイテム">
              <div id="items"></div>
            </section>
            <section class="ao-tab" data-tab="village" data-label="🏛 村">
              <div id="governance"></div>
              <div id="intervention-rules"></div>
            </section>
            <section class="ao-tab" data-tab="trial" data-label="⚖ 裁判">
              <div id="trial"></div>
              <div id="bet"></div>
            </section>
            <section class="ao-tab" data-tab="econ" data-label="💰 経済">
              <div id="economy"></div>
            </section>
            <section class="ao-tab" data-tab="chat" data-label="💬 チャット">
              <div id="chat"></div>
            </section>
          </div>
        </div>
      </div>
      <div id="center">
        <div id="stage"></div>
        <div id="verdict">
          <button id="v-guilty" class="verdict-btn guilty"><span class="vb-ja">死刑</span><span class="vb-en">DEATH</span></button>
          <button id="v-innocent" class="verdict-btn innocent"><span class="vb-ja">教育</span><span class="vb-en">EDUCATE</span></button>
        </div>
        <div id="log"></div>
      </div>
      <div id="right" class="col">
        <div class="side-tabs">
          <button class="side-tab-btn active" data-right-tab="village">村の情報</button>
          <button class="side-tab-btn" data-right-tab="incident">事件</button>
          <button class="side-tab-btn" data-right-tab="residents">住民</button>
          <button class="side-tab-btn" data-right-tab="status">状態</button>
        </div>
        <section class="side-tab-panel" data-right-panel="village">
          <canvas id="radar" width="316" height="250"></canvas>
          <div id="vstatus"></div>
          <div id="village-rules"></div>
        </section>
        <section class="side-tab-panel" data-right-panel="incident" hidden>
          <div id="incident-info"></div>
        </section>
        <section class="side-tab-panel" data-right-panel="residents" hidden>
          <div id="residents"></div>
        </section>
        <section class="side-tab-panel" data-right-panel="status" hidden>
          <div class="ao-status">
            <div id="status-head">📊 状態 ▸</div>
            <div id="status-body"></div>
          </div>
          <div id="leaderboard"></div>
          <div id="spectacle"></div>
        </section>
      </div>
      <div id="backdrop"></div>
    </div>
    <div id="ao-backdrop"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
